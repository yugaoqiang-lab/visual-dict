  .word-hit.fav { box-shadow: inset 0 -3px 0 #f5a623; }
  #favBtn.on { background: #f5a623; color: #2b2f36; border-color: #f5a623; }
  body.collect .word-hit { cursor: cell; }
  .ipa { position: absolute; font-size: 11px; line-height: 1; color: #b3261e; font-weight: 600;
         background: rgba(255,255,255,.9); border: 1px solid #e7c4c0; border-radius: 4px;
         padding: 1px 4px; white-space: nowrap; cursor: pointer;

  .ipa.approx::before { content: "≈"; opacity: .75; margin-right: 1px; }
  body.no-ipa .ipa { display: none; }
  #toast { position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%);

           opacity: 0; transition: opacity .25s; pointer-events: none; z-index: 100; }
  #toast.show { opacity: 1; }
  #results { position: absolute; background: #1f2329; border: 1px solid #555; border-radius: 8px;
             max-height: 320px; overflow: auto; z-index: 60; font-size: 13px; min-width: 220px; }
  #results div { padding: 6px 10px; cursor: pointer; display: flex; justify-content: space-between; gap: 10px; }
  #results div:hover { background: #3a4049; }
  #results .pi { color: #9aa0a6; }
  .srch-wrap { position: relative; }
  /* 🪟 点单词弹出操作菜单 */
  .word-popup { position: fixed; z-index: 70; background: #1f2329; color: #e8eaed;

  .word-popup .ph b { font-weight: 700; max-width: 120px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .word-popup .ph .ipa { color: #b3261e; font-size: 12px; margin-left: 6px; }
  .word-popup .ph .ipa.approx { color: #5da6f0; }
  .word-popup .ex { padding:6px 8px 2px; font-size:12px; color:#9aa0a6; font-style:italic; line-height:1.4; word-break:break-word; }
  .word-popup .ph .x { background: none; border: none; color: #9aa0a6; font-size: 16px; cursor: pointer; padding: 0 4px; }

}
function speak(text){
  // 优先用原生安卓 TTS 桥：WebView 的 Web Speech API 多数真机不可用，原生 TTS 离线可用
  if (window.AndroidTTS && typeof window.AndroidTTS.speak === 'function') {
    try { window.AndroidTTS.speak(String(text)); if (window.AndroidTTS.needInstall && window.AndroidTTS.needInstall()) showTtsHint(); return; } catch(e){}
  }
  if (!window.speechSynthesis) { toast('当前设备未启用语音播报'); return; }
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'en-US'; u.rate = 0.95; u.pitch = 1;
  const v = voices.find(v => /en[-_]US/i.test(v.lang));
  if (v) u.voice = v;
  speechSynthesis.speak(u);
  toast('🔊 ' + text);
}
let toastTimer;
function toast(msg){
  toastEl.textContent = msg; toastEl.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(()=>toastEl.classList.remove('show'), 1400);
}

/* ---------- favorites (生词本, 与 search.html 共用 localStorage['vd_favs']) ---------- */
let favs = new Set(JSON.parse(localStorage.getItem('vd_favs')||'[]'));
let collectMode = false;
function saveFavs(){ try{ localStorage.setItem('vd_favs', JSON.stringify([...favs])); }catch(e){} }
function toggleFav(word){ if(favs.has(word)) favs.delete(word); else favs.add(word); saveFavs(); return favs.has(word); }
function updateFavBtn(){
  const b = document.getElementById('favBtn');
  if(!b) return;
  b.classList.toggle('on', collectMode);
  b.textContent = (collectMode?'★ 收藏中…':'⭐ 收藏模式') + ' (' + favs.size + ')';
}

/* ---------- render ---------- */
function render(idx){
  cur = Math.max(0, Math.min(PAGES.length - 1, idx));
  try{ localStorage.setItem('vd_lastPage', String(cur)); }catch(e){}
  const p = PAGES[cur];
  img.src = p.img;
  overlay.innerHTML = '';
  for (const w of p.words){
    const hit = document.createElement('div');
    hit.className = 'word-hit';
    hit.style.left = w.x + '%'; hit.style.top = w.y + '%';
    hit.style.width = w.w + '%'; hit.style.height = w.h + '%';
    hit.dataset.word = w.t;
    if (favs.has(w.t)) hit.classList.add('fav');
    overlay.appendChild(hit);
    if (w.ipa && showIpa){
      const ip = document.createElement('div');
      ip.className = 'ipa' + (w.approx ? ' approx' : '');
      if (w.approx) ip.title = '近似音标（规则推算，仅供参考）';
      // 与英文单词同行（标签底沿）；默认右侧放，仅贴边(>94%)翻到左侧，并加 4px 间隙
      ip.style.top = (w.y + w.h) + '%';
      if (w.x + w.w > 94){
        ip.style.right = (100 - w.x) + '%';
        ip.style.transform = 'translate(-4px,-50%)';
      } else {
        ip.style.left = (w.x + w.w) + '%';
        ip.style.transform = 'translate(4px,-50%)';
      }
      ip.dataset.word = w.t;
      ip.textContent = w.ipa;
      overlay.appendChild(ip);
    }
  }
  jump.value = p.n;
  const ipaCount = p.words.filter(w=>w.ipa).length;
  stat.textContent = `第 ${cur+1}/${PAGES.length} 页 · 原书 P${p.n} · 本页 ${p.words.length} 词（音标 ${ipaCount}）`;
  updateFavBtn();
}

overlay.addEventListener('click', e=>{
  const el = e.target.closest('[data-word]');
  if (!el) return;
  const word = el.dataset.word;
  if (collectMode){
    const on = toggleFav(word);
    const hitEl = el.classList.contains('word-hit') ? el : overlay.querySelector('.word-hit[data-word="'+CSS.escape(word)+'"]');
    if (hitEl) hitEl.classList.toggle('fav', on);
    updateFavBtn();
    toast((on?'★ 已加入生词本: ':'☆ 已移出生词本: ')+word);
  } else {
    showWordPopup(el, word);
  }
});

/* ---------- 🪟 点单词弹操作菜单 ---------- */
const wordPopup = document.getElementById('wordPopup');
function escAttr(s){ return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function showWordPopup(el, word){
  const curPage = PAGES[cur];
  const w = curPage.words.find(x => x.t === word);
  if (!w) { speak(word); return; }
  const ipa = w.ipa || '', approx = w.approx, isFav = favs.has(word);
  wordPopup.innerHTML =
    '<div class="ph"><span><b>'+escAttr(word)+'</b>'+(ipa?' <span class="ipa'+(approx?' approx':'')+'">'+escAttr(ipa)+'</span>':'')+'</span>'+
    '<button class="x" onclick="hideWordPopup()">✕</button></div>'+
    (window.EXAMPLES && window.EXAMPLES[word] ? '<div class="ex">💡 '+escAttr(window.EXAMPLES[word])+'</div>' : '')+
    '<button class="act" onclick="popupSpeak(\''+escAttr(word)+'\')">🔊 朗读</button>'+
    '<button class="act" onclick="popupToggleFav(\''+escAttr(word)+'\')">'+(isFav?'★ 已收藏（点移除）':'☆ 收藏到生词本')+'</button>'+
    '<button class="act" onclick="popupSearch(\''+escAttr(word)+'\')">🔍 在词库中查</button>';
  wordPopup.style.display = 'block';
  const rect = el.getBoundingClientRect();
  const pw = 180, gap = 8;
  let left = rect.right + gap;
  let top = rect.top;
  if (left + pw > window.innerWidth - 8) left = rect.left - pw - gap;
  if (left < 8) left = 8;
  if (top + 180 > window.innerHeight - 8) top = window.innerHeight - 190;
  if (top < 8) top = 8;
  wordPopup.style.left = left + 'px';
  wordPopup.style.top  = top + 'px';
  popupSpeak(word); // 自动朗读一次，打开就有声
}
function hideWordPopup(){ wordPopup.style.display = 'none'; }
function popupSpeak(w){ speak(w); }
function popupToggleFav(w){
  const on = toggleFav(w);
  const hitEl = overlay.querySelector('.word-hit[data-word="'+CSS.escape(w)+'"]');
  if (hitEl) hitEl.classList.toggle('fav', on);
  updateFavBtn();
  toast((on?'★ 已加入生词本: ':'☆ 已移出生词本: ')+w);
  // 刷新弹窗里这一项文字
  const btns = wordPopup.querySelectorAll('button.act');
  if (btns[1]) btns[1].innerHTML = (on?'★ 已收藏（点移除）':'☆ 收藏到生词本');
}
function popupSearch(w){ location.href='search.html#q='+encodeURIComponent(w); }
// 点弹窗外关闭
document.addEventListener('click', e=>{
  if (wordPopup.style.display==='none') return;
  if (e.target.closest('#wordPopup')) return;
  if (e.target.closest('[data-word]')) return;
  hideWordPopup();
});
// Esc 关闭
document.addEventListener('keydown', e=>{ if (e.key==='Escape') hideWordPopup(); });

/* ---------- nav ---------- */
document.getElementById('prev').onclick = ()=>render(cur-1);
document.getElementById('next').onclick = ()=>render(cur+1);
jump.onchange = ()=>{
  const n = parseInt(jump.value, 10);
  const idx = PAGES.findIndex(p=>p.n===n);
  if (idx>=0) render(idx); else { const i=PAGES.findIndex(p=>p.n>=n); render(i<0?PAGES.length-1:i); }
};
document.getElementById('ipaToggle').onchange = e=>{
  showIpa = e.target.checked;
  document.body.classList.toggle('no-ipa', !showIpa);
  render(cur);
};
document.addEventListener('keydown', e=>{
  if (e.target.tagName==='INPUT') return;
  if (e.key==='ArrowLeft') render(cur-1);
  if (e.key==='ArrowRight') render(cur+1);
});
document.getElementById('favBtn').onclick = ()=>{
  collectMode = !collectMode;
  document.body.classList.toggle('collect', collectMode);
  updateFavBtn();
  if (collectMode) toast('收藏模式：点单词加入/移出生词本');
};
document.getElementById('viewFav').onclick = ()=>{ location.href='search.html#fav'; };

/* ---------- search ---------- */
const allWords = [];
PAGES.forEach((p,i)=>p.words.forEach(w=>allWords.push({w, pageIdx:i, n:p.n})));
searchBox.addEventListener('input', ()=>{
  const q = searchBox.value.trim().toLowerCase();
  if (!q){ results.style.display='none'; return; }
  const hits = allWords.filter(o=>o.w.t.toLowerCase().includes(q)).slice(0,40);
  if (!hits.length){ results.style.display='none'; return; }
  results.innerHTML = '';
  hits.forEach(o=>{
    const d = document.createElement('div');
    d.innerHTML = `<span>${o.w.t}${o.w.ipa?' <span style="color:'+(o.w.approx?'#1f6fd6':'#e08')+'">'+o.w.ipa+'</span>':''}</span><span class="pi">P${o.n}</span>`;
    d.onclick = ()=>{ render(o.pageIdx); flash(o.w.t); results.style.display='none'; searchBox.blur(); };
    results.appendChild(d);
  });
  results.style.display = 'block';
});
document.addEventListener('click', e=>{ if(!e.target.closest('.srch-wrap')) results.style.display='none'; });
function flash(term){
  requestAnimationFrame(()=>{
    const el = overlay.querySelector(`.word-hit[data-word="${CSS.escape(term)}"]`);
    if (el){ el.classList.add('flash'); setTimeout(()=>el.classList.remove('flash'), 1500); }
  });
}

const __savedPage = parseInt(localStorage.getItem('vd_lastPage')||'', 10);
render((!isNaN(__savedPage) && __savedPage>=0 && __savedPage<PAGES.length) ? __savedPage : 0);

/* 支持从搜索页按 #原书页号 跳转，如 index2.html#15 */
(function(){
  const h = (location.hash || '').replace('#','').trim();
  if (h){
    const n = parseInt(h, 10);
    if (!isNaN(n)){
      const idx = PAGES.findIndex(p=>p.n===n);
      if (idx>=0) render(idx);
    }
  }
})();
</script>
