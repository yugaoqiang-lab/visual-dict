plugins {
    id 'com.android.application'
}

android {
    namespace 'com.klyde.visualdict'
    compileSdk 34

    defaultConfig {
        applicationId "com.klyde.visualdict"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    signingConfigs {
        release {
            storeFile file('keystore/visualdict.jks')
            storePassword 'Klyde@2026'
            keyAlias 'visualdict'
            keyPassword 'Klyde@2026'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
}
